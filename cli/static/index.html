<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hailo-Ollama-WebUI</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Chats</span>
        <button id="chat-new" class="chat-new-btn" type="button" title="Start a new chat">＋</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </aside>

    <div class="main">
    <header class="topbar">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" title="Toggle chat list">☰</button>
      <div class="brand">Hailo&nbsp;Ollama</div>
      <button id="npu-chip" class="npu-chip" type="button" title="Live NPU status">NPU …</button>
    </header>

    <main id="messages" class="messages">
      <div class="empty-state" id="empty-state">
        <h1>Hailo Ollama Chat</h1>
        <p>Ask anything. Responses stream live from your local NPU.</p>
      </div>
    </main>

    <footer class="composer">
      <form id="chat-form" autocomplete="off">
        <div class="composer-controls">
          <label for="model-select" class="model-label">Model:</label>
          <select id="model-select" class="model-select">
            <option value="">Loading models…</option>
          </select>
          <label for="instruction-select" class="instruction-label">Instruction:</label>
          <select id="instruction-select" class="instruction-select" title="Saved system instructions">
            <option value="">None</option>
          </select>
          <label class="think-toggle" title="Request separate reasoning from thinking-capable models">
            <input type="checkbox" id="think-toggle" />
            <span>Thinking</span>
          </label>
          <button id="new-chat" class="new-chat-btn" type="button" title="Start a new chat">+ New chat</button>
        </div>
        <div class="composer-row">
          <textarea id="prompt-input" rows="1" placeholder="Message Hailo Ollama…" required></textarea>
          <button type="submit" id="send-btn" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>
    </footer>
    </div><!-- /.main -->

    <aside id="npu-drawer" class="npu-drawer" aria-hidden="true">
      <header class="npu-drawer-header">
        <span>NPU Status</span>
        <button id="npu-close" type="button" title="Close">✕</button>
      </header>
      <div id="npu-body" class="npu-body"></div>
    </aside>

    <dialog id="instruction-dialog" class="instruction-dialog">
      <h2>Add instruction</h2>
      <input id="instruction-name" class="instruction-field" type="text" placeholder="Name (e.g. Code reviewer)…" maxlength="80" />
      <textarea id="instruction-text" class="instruction-field" rows="6" placeholder="Instruction text sent as the system message…"></textarea>
      <div class="dialog-actions">
        <button type="button" id="instruction-cancel" class="dialog-btn">Cancel</button>
        <button type="button" id="instruction-save" class="dialog-btn primary">Save</button>
      </div>
    </dialog>

    <dialog id="model-add-dialog" class="instruction-dialog">
      <h2>Add model</h2>
      <div id="model-remote-list" class="model-remote-list">
        <div class="model-remote-empty">Loading available models…</div>
      </div>
      <div class="dialog-actions">
        <button type="button" id="model-add-close" class="dialog-btn">Close</button>
      </div>
    </dialog>

    <dialog id="model-remove-dialog" class="instruction-dialog">
      <h2>Remove model</h2>
      <div id="model-installed-list" class="model-remote-list"></div>
      <div class="dialog-actions">
        <button type="button" id="model-remove-close" class="dialog-btn">Close</button>
      </div>
    </dialog>
  </div>
  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
