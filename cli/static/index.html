<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hailo Ollama Chat</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Hailo&nbsp;Ollama</div>
      <button id="new-chat" class="new-chat-btn" type="button" title="Start a new chat">+ New chat</button>
    </header>

    <main id="messages" class="messages">
      <div class="empty-state" id="empty-state">
        <h1>Hailo Ollama Chat</h1>
        <p>Ask anything. Responses stream live from your local NPU.</p>
      </div>
    </main>

    <footer class="composer">
      <form id="chat-form" autocomplete="off">
        <select id="model-select" class="model-select">
          <option value="">Loading models…</option>
        </select>
        <input id="system-input" class="system-input" type="text" placeholder="System instruction (optional)…" />
        <div class="composer-row">
          <textarea id="prompt-input" rows="1" placeholder="Message Hailo Ollama…" required></textarea>
          <button type="submit" id="send-btn" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <label class="think-toggle" title="Request separate reasoning from thinking-capable models">
          <input type="checkbox" id="think-toggle" />
          <span>Thinking</span>
        </label>
      </form>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
